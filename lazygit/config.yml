os:
  editPreset: "nvim"
gui:
  authorColors:
    "*": "default"
  sidePanelWidth: 0.16
  mainPanelSplitMode: horizontal
  enlargedSideViewLocation: top
  screenMode: normal
  showCommandLog: false
  expandFocusedSidePanel: false
  wrapLinesInStagingView: false
  sidePanels:
    - [status]
    - [files, worktrees, submodules]
    - [branches, tags]
    - [remotes]
    - [commits, reflog]
    - [stash]
promptToReturnFromSubprocess: false
git:
  ignoreWhitespaceInDiffView: true
  diffContextSize: 5
  branchLogCmd: "/Users/hishi/Dev/dotfiles/lazygit/branch-log.sh {{branchName}}"
  allBranchesLogCmds:
    - "/Users/hishi/Dev/dotfiles/lazygit/branch-log.sh --all"
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --side-by-side --dark --line-fill-method=spaces --hunk-header-style='syntax' --file-style='bold' --file-decoration-style=none --plus-style='syntax #2a4556' --plus-emph-style='syntax bold #394b70' --minus-style='syntax #4b2a3d' --minus-emph-style='syntax bold #633540' --zero-style='normal normal' --line-numbers-left-style='#4a4a4a' --line-numbers-right-style='#4a4a4a' --line-numbers-minus-style='#4a4a4a' --line-numbers-zero-style='#4a4a4a' --line-numbers-plus-style='#4a4a4a'"
      useConfig: false
keybinding:
  files:
    commitChanges: "C"
    commitChangesWithEditor: "c"

customCommands:
  - key: "a"
    description: "Toggle all-branches log view"
    context: "localBranches"
    command: "/Users/hishi/Dev/dotfiles/lazygit/branch-log-toggle.sh"
